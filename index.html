<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Ounces per Bitcoin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4a843;--gold-light:#f0d78c;--gold-dark:#a07c28;--bg:#0a0a0f;--text:#e8e0d0;--dim:#7a7060}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;height:100vh}
body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none}
.orb-1{width:500px;height:500px;background:rgba(212,168,67,.08);top:-100px;right:-100px}
.orb-2{width:600px;height:600px;background:rgba(212,168,67,.05);bottom:-200px;left:-150px}
.container{max-width:1100px;margin:0 auto;padding:14px 24px;position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}
.hero{text-align:center;padding:10px 0 6px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.hero-tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.hero h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(1.3rem,3.5vw,1.9rem);line-height:1.2;
  background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
#live-dot{display:inline-block;width:7px;height:7px;background:#4ade80;border-radius:50%;box-shadow:0 0 6px #4ade80;opacity:0;transition:opacity .5s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 12px}
.stat-card{background:linear-gradient(145deg,rgba(212,168,67,.06),rgba(255,255,255,.02));
  border:1px solid rgba(212,168,67,.12);border-radius:12px;padding:12px 8px;text-align:center}
.stat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.stat-value{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--gold-light)}
.stat-sub{font-size:10px;color:var(--dim);margin-top:2px}
.chart-section{background:linear-gradient(160deg,rgba(212,168,67,.04),rgba(255,255,255,.01));
  border:1px solid rgba(212,168,67,.1);border-radius:16px;padding:14px 20px 10px;flex:1;display:flex;flex-direction:column;min-height:0}
.chart-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.chart-title{font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;color:var(--text)}
.status-msg{font-size:11px;color:var(--dim);margin-left:8px;font-weight:400}
.chart-controls{display:flex;gap:5px}
.chart-controls button{background:transparent;border:1px solid rgba(212,168,67,.2);color:var(--dim);
  padding:5px 12px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;transition:all .25s;letter-spacing:.5px}
.chart-controls button:hover,.chart-controls button.active{background:rgba(212,168,67,.15);color:var(--gold-light);border-color:var(--gold)}
.chart-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#chart-canvas{width:100%;height:100%;display:block;cursor:crosshair}
.tooltip{position:absolute;pointer-events:none;background:rgba(10,10,15,.92);border:1px solid rgba(212,168,67,.3);
  border-radius:10px;padding:10px 14px;font-size:12px;color:var(--text);backdrop-filter:blur(12px);opacity:0;transition:opacity .15s;z-index:10;white-space:nowrap}
.tooltip .tt-date{color:var(--dim);font-size:10px;margin-bottom:3px}
.tooltip .tt-val{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold-light)}
.footer{text-align:center;padding:8px 0 4px;color:var(--dim);font-size:10px;letter-spacing:.5px}
.footer span{color:var(--gold)}
.loading-spinner{width:24px;height:24px;border:2px solid rgba(212,168,67,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.hero,.stats,.chart-section{animation:fadeDown .7s ease both}
.stats{animation-delay:.15s}.chart-section{animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.loading-text{color:var(--dim);font-size:13px;animation:pulse 1.5s ease-in-out infinite}
</style>
</head>
<body>
<div class="orb orb-1"></div><div class="orb orb-2"></div>
<div class="container">
  <div class="hero">
    <span class="hero-tag">Hard Money Index</span>
    <h1>Gold Ounces per Bitcoin</h1>
    <span id="live-dot"></span>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="stat-label">Current Ratio</div><div class="stat-value" id="stat-ratio">—</div><div class="stat-sub">oz Au / BTC</div></div>
    <div class="stat-card"><div class="stat-label">BTC Price</div><div class="stat-value" id="stat-btc">—</div><div class="stat-sub">USD</div></div>
    <div class="stat-card"><div class="stat-label">Gold Price</div><div class="stat-value" id="stat-gold">—</div><div class="stat-sub">USD / oz</div></div>
    <div class="stat-card"><div class="stat-label">All-Time High</div><div class="stat-value" id="stat-ath">—</div><div class="stat-sub">oz Au / BTC</div></div>
  </div>
  <div class="chart-section">
    <div class="chart-header">
      <div class="chart-title">Historical Ratio<span class="status-msg" id="status"></span></div>
      <div class="chart-controls">
        <button data-range="1y">1Y</button>
        <button data-range="3y">3Y</button>
        <button data-range="all" class="active">ALL</button>
      </div>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <div id="loading-overlay" style="text-align:center">
        <div class="loading-spinner"></div>
        <div class="loading-text">Fetching live BTC & gold data…</div>
      </div>
      <canvas id="chart-canvas" style="display:none"></canvas>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>
  <div class="footer" id="footer">Prices via CoinGecko (BTC + PAXG) · <span>₿</span> + <span>Au</span></div>
</div>
<script>
const CG='https://api.coingecko.com/api/v3';
let data=[],currentData=[],W,H;
const canvas=document.getElementById('chart-canvas'),ctx=canvas.getContext('2d'),tooltip=document.getElementById('tooltip');
const pad={t:16,r:16,b:32,l:50};

function updateStats(){
  if(!data.length)return;
  const l=data[data.length-1],ath=Math.max(...data.map(d=>d.ratio));
  document.getElementById('stat-ratio').textContent=l.ratio.toFixed(1);
  document.getElementById('stat-btc').textContent='$'+Math.round(l.btc).toLocaleString();
  document.getElementById('stat-gold').textContent='$'+Math.round(l.gold).toLocaleString();
  document.getElementById('stat-ath').textContent=ath.toFixed(1);
}

// Fetch with retry on 429
async function cgFetch(url,retries=3){
  for(let i=0;i<retries;i++){
    const res=await fetch(url);
    if(res.ok) return res.json();
    if(res.status===429){await new Promise(r=>setTimeout(r,5000*(i+1)));continue}
    throw new Error('CoinGecko '+res.status);
  }
  throw new Error('CoinGecko rate limited');
}

// Build historical data from CoinGecko market_chart
async function fetchHistorical(){
  document.getElementById('status').textContent='loading…';
  try{
    // Days since 2020-01-01
    const fromTs=Math.floor(new Date('2020-01-01').getTime()/1000);
    const toTs=Math.floor(Date.now()/1000);

    // Fetch BTC and PAXG (1 PAXG = 1 troy oz gold) historical prices
    const [btcData,goldData]=await Promise.all([
      cgFetch(`${CG}/coins/bitcoin/market_chart/range?vs_currency=usd&from=${fromTs}&to=${toTs}`),
      cgFetch(`${CG}/coins/pax-gold/market_chart/range?vs_currency=usd&from=${fromTs}&to=${toTs}`)
    ]);

    const btcPrices=btcData.prices; // [[timestamp,price],...]
    const goldPrices=goldData.prices;

    // Build a gold price lookup map by date string
    const goldMap=new Map();
    goldPrices.forEach(([ts,p])=>{
      const d=new Date(ts);
      const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      goldMap.set(key,p);
    });

    // Match BTC prices with closest gold price, sample weekly
    const merged=[];
    let lastGold=null;
    btcPrices.forEach(([ts,btc],i)=>{
      const d=new Date(ts);
      const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const gold=goldMap.get(key);
      if(gold) lastGold=gold;
      if(!lastGold) return;
      // Sample: keep every 7th point for cleaner chart
      if(i%7!==0 && i!==btcPrices.length-1) return;
      const label=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      merged.push({date:key,label,btc,gold:lastGold,ratio:+(btc/lastGold).toFixed(2)});
    });

    data=merged;
    if(data.length>0){
      document.getElementById('loading-overlay').style.display='none';
      canvas.style.display='block';
      document.getElementById('live-dot').style.opacity=1;
      updateStats();applyRange();animateChart(currentData);
      document.getElementById('status').textContent='';
      setFooter();
    }
  }catch(e){
    console.error('Historical fetch failed:',e);
    document.getElementById('status').textContent='retrying…';
    setTimeout(fetchHistorical,6000);
  }
}

// Refresh latest price every 60s
async function fetchLive(){
  if(!data.length) return;
  document.getElementById('status').textContent='updating…';
  try{
    const j=await cgFetch(`${CG}/simple/price?ids=bitcoin,pax-gold&vs_currencies=usd`);
    const btc=j.bitcoin?.usd, gold=j['pax-gold']?.usd;
    if(btc&&gold){
      const ratio=+(btc/gold).toFixed(2);
      const now=new Date();
      const key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      const label=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
      const last=data[data.length-1];
      if(last.date===key) data[data.length-1]={date:key,label,btc,gold,ratio};
      else data.push({date:key,label,btc,gold,ratio});
      updateStats();applyRange();resize();draw(currentData);
      const el=document.getElementById('stat-ratio');
      el.style.transition='color .15s';el.style.color='#fff';setTimeout(()=>el.style.color='',400);
      setFooter();
    }
  }catch(e){console.warn('Live fetch failed:',e)}
  document.getElementById('status').textContent='';
}

function setFooter(){
  document.getElementById('footer').innerHTML='Live · '+new Date().toLocaleTimeString()+' · <span style="color:#d4a843">₿</span> + <span style="color:#d4a843">Au</span>';
}

fetchHistorical().then(()=>setInterval(fetchLive,60000));

// --- Chart ---
function resize(){
  const dpr=window.devicePixelRatio||1,rect=canvas.parentElement.getBoundingClientRect();
  W=rect.width;H=rect.height;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(pts,ap=1){
  ctx.clearRect(0,0,W,H);if(!pts.length)return;
  const maxR=Math.max(...pts.map(p=>p.ratio))*1.1,minR=Math.min(...pts.map(p=>p.ratio))*0.85;
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b,xs=cW/(pts.length-1||1);
  const tx=i=>pad.l+i*xs,ty=r=>pad.t+cH-((r-minR)/(maxR-minR))*cH;
  ctx.strokeStyle='rgba(212,168,67,.08)';ctx.lineWidth=1;
  for(let i=0;i<=5;i++){const v=minR+(maxR-minR)*(i/5),y=ty(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='rgba(122,112,96,.6)';ctx.font='11px DM Sans,sans-serif';ctx.textAlign='right';ctx.fillText(v.toFixed(1),pad.l-8,y+4)}
  ctx.fillStyle='rgba(122,112,96,.6)';ctx.font='10px DM Sans,sans-serif';ctx.textAlign='center';
  const le=Math.max(1,Math.floor(pts.length/10));
  pts.forEach((p,i)=>{if(i%le===0||i===pts.length-1)ctx.fillText(p.label,tx(i),H-pad.b+16)});
  const dc=Math.floor(pts.length*ap);if(dc<2)return;
  const gr=ctx.createLinearGradient(0,pad.t,0,H-pad.b);gr.addColorStop(0,'rgba(212,168,67,.18)');gr.addColorStop(1,'rgba(212,168,67,0)');
  ctx.beginPath();ctx.moveTo(tx(0),ty(pts[0].ratio));for(let i=1;i<dc;i++)ctx.lineTo(tx(i),ty(pts[i].ratio));
  ctx.lineTo(tx(dc-1),H-pad.b);ctx.lineTo(tx(0),H-pad.b);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.beginPath();ctx.moveTo(tx(0),ty(pts[0].ratio));for(let i=1;i<dc;i++)ctx.lineTo(tx(i),ty(pts[i].ratio));
  ctx.strokeStyle='#d4a843';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  const lx=tx(dc-1),ly=ty(pts[dc-1].ratio),gw=ctx.createRadialGradient(lx,ly,0,lx,ly,12);
  gw.addColorStop(0,'rgba(240,215,140,.6)');gw.addColorStop(1,'rgba(212,168,67,0)');
  ctx.fillStyle=gw;ctx.fillRect(lx-14,ly-14,28,28);
  ctx.beginPath();ctx.arc(lx,ly,4,0,Math.PI*2);ctx.fillStyle='#f0d78c';ctx.fill();
}
function animateChart(pts){const dur=1000,st=performance.now();(function f(t){const p=Math.min(1,(t-st)/dur);draw(pts,1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(f)})(st)}
function applyRange(){
  const r=document.querySelector('.chart-controls button.active')?.dataset.range||'all';
  if(r==='all'){currentData=data}
  else{
    const yrs=r==='1y'?1:3;
    const cutoff=new Date();cutoff.setFullYear(cutoff.getFullYear()-yrs);
    const cutStr=cutoff.toISOString().slice(0,10);
    currentData=data.filter(d=>d.date>=cutStr);
  }
  resize();draw(currentData);
}
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,cW=W-pad.l-pad.r;
  const idx=Math.round(((mx-pad.l)/cW)*(currentData.length-1));
  if(idx<0||idx>=currentData.length){tooltip.style.opacity=0;return}
  const pt=currentData[idx];
  tooltip.innerHTML=`<div class="tt-date">${pt.date}</div><div class="tt-val">${pt.ratio.toFixed(1)} oz Au</div><div style="font-size:10px;color:#7a7060;margin-top:2px">BTC $${Math.round(pt.btc).toLocaleString()} · Gold $${Math.round(pt.gold).toLocaleString()}</div>`;
  tooltip.style.opacity=1;let ttx=e.clientX-rect.left+14,tty=e.clientY-rect.top-60;if(ttx+160>W)ttx-=180;
  tooltip.style.left=ttx+'px';tooltip.style.top=tty+'px';
});
canvas.addEventListener('mouseleave',()=>tooltip.style.opacity=0);
document.querySelectorAll('.chart-controls button').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.chart-controls button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');applyRange();animateChart(currentData);
}));
window.addEventListener('resize',()=>{if(data.length){resize();draw(currentData)}});
</script>
</body>
</html>
